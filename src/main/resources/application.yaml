spring:
  application:
    name: cicd
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: 1234

  data:
    mongodb:
      username: test
      password: 1234
      host: localhost
      port: 27017
      database: test

    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect


